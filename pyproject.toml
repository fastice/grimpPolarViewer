[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grimppolarviewer"
version = "0.1.0"
description = "Command-line downloader for GrIMP Polar Viewer selections (NSIDC first, Kopah otherwise)"
readme = "Documents/grimpDownload.md"
license = { text = "MIT" }
authors = [{ name = "Ian Joughin", email = "ian@apl.washington.edu" }]
requires-python = ">=3.9"
dependencies = ["rasterio>=1.3", "requests", "pyyaml", "rich"]

[project.urls]
Homepage = "https://github.com/fastice/grimpPolarViewer"

[project.scripts]
grimpdownload = "grimppolarviewer.grimpDownload:main"

[tool.setuptools]
packages = ["grimppolarviewer"]
